<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета — Космос</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>

    <div class="header-container">
        <div class="container">
            <a href="index.html" class="logo">Космос</a>
            <ul class="menu">
                <li><a href="index.html">Главная</a></li>
                <li><a href="gallery.html">Галерея</a></li>
                <li><a href="form.html" class="active">Анкета</a></li>
            </ul>
        </div>
    </div>

    <div class="content-container">
        <div class="container">
            <h2>Регистрация и анкета</h2>
            
            <div class="form-container">
                <form action="#" method="post" onsubmit="window.location.href='404.html'; return false;">
                    
                    <div class="form-group">
                        <label for="surname">Фамилия:</label>
                        <input type="text" id="surname" name="surname" required minlength="2" pattern="[А-Яа-яЁёA-Za-z-]+" title="Введите фамилию без цифр и спецсимволов" placeholder="Введите вашу фамилию">
                    </div>

                    <div class="form-group">
                        <label for="name">Имя:</label>
                        <input type="text" id="name" name="name" required minlength="2" pattern="[А-Яа-яЁёA-Za-z-]+" title="Введите имя без цифр и спецсимволов" placeholder="Введите ваше имя">
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required placeholder="example@mail.com">
                    </div>

                    <div class="form-group">
                        <label for="theme">Интересующая тема:</label>
                        <select id="theme" name="theme" required>
                            <option value="" disabled selected>Выберите тему</option>
                            <option value="stars">Звезды</option>
                            <option value="planets">Планеты</option>
                            <option value="rockets">Ракеты</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" name="rules" required> Согласен с правилами
                        </label>
                    </div>

                    <button type="submit" class="button">Отправить</button>
                </form>
            </div>
        </div>
    </div>

    <div class="footer-container">
        <div class="container">
            <p>&copy; 2026 Космос. Все права защищены.</p>
        </div>
    </div>

</body>
</html>
